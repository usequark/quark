version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

    # Split by semver update type. A single "production" group bundles patch,
    # minor and major bumps into one PR, so a breaking change hides behind a
    # wall of safe patches and gets rubber-stamped. Majors get their own PR.
    groups:
      production-majors:
        dependency-type: production
        update-types: ["major"]
      development-majors:
        dependency-type: development
        update-types: ["major"]
      production-minor:
        dependency-type: production
        update-types: ["minor"]
      production-patch:
        dependency-type: production
        update-types: ["patch"]
      development-minor:
        dependency-type: development
        update-types: ["minor"]
      development-patch:
        dependency-type: development
        update-types: ["patch"]

    open-pull-requests-limit: 10

  # Keep workflow actions current. Without this block nothing tracks the `uses:`
  # pins, and an action that drops to a deprecated runtime only ever shows up as
  # a log annotation — never as a failing check — so scaffolded projects
  # silently accumulate stale pins. Majors get their own PR because action
  # majors can change runtime or drop inputs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-majors:
        update-types: ["major"]
      actions-minor:
        update-types: ["minor"]
      actions-patch:
        update-types: ["patch"]
    commit-message:
      prefix: "deps(actions)"
    open-pull-requests-limit: 4
