packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - esbuild
  - msgpackr-extract
  - sharp
  - simple-git-hooks

overrides:
  # next-auth@5.0.0-beta.32 and @auth/core@0.41.3 declare nodemailer as an
  # OPTIONAL peer with the range `^7.0.7 || ^8.0.5`. Every advisory against
  # nodemailer needs >=10.0.6, so no version inside that peer range is
  # patched, and neither package has shipped a newer release that widens it.
  #
  # Nothing in this repo uses Auth.js's Nodemailer email provider: auth.js
  # configures Credentials, Github and Google only, and @auth/core's index
  # never imports nodemailer statically (only providers/nodemailer.js does).
  # Outgoing mail goes through @usequark/quark-core, which depends on
  # nodemailer ^10.0.10 directly. Removing the unused peer edge deletes the
  # vulnerable 7.0.13 copy from the tree instead of forcing it two majors past
  # a range its author chose. Delete these two lines if you ever add
  # next-auth/providers/nodemailer.
  "next-auth>nodemailer": "-"
  "@auth/core>nodemailer": "-"
  # stripe@17.7.0 declares `qs: ^6.11.0`, so a current release is inside its
  # own range and `pnpm update` cannot move it (qs is not a direct dependency
  # of any workspace package). The floor tracks the newest advisory:
  # GHSA-g4mx-9h6g-cwc7 / GHSA-hrpp-f998-fjpq needed >=6.16.0, and
  # GHSA-6pq8-jhm2-2vcw (2026-11-09) needs >=6.16.1.
  qs@>=6.14.2 <=6.16.0: ">=6.16.1"
  # node-forge@1.4.0 comes from @expo/cli's tree (`^1.3.3`), so 1.4.1 is
  # inside the declared range - a same-major patch, build-time only (Expo
  # code signing). It clears twelve advisories at once: GHSA-4642/6wvx/525v/
  # 7wch/h6cr/4487/5cwg/jc66/8hrf/hqq3/5x38, plus GHSA-86w9-cpqp-85rv which
  # 1.4.x also fixed - both were retired from the allowlist on 2026-11-09.
  node-forge@<=1.4.0: ">=1.4.1"
  # undici@8.11.2 sits behind dependents that declare ^8.x, so 8.12.2 is
  # inside their ranges - same major, no API change. Clears GHSA-4qv8/f72v/
  # 9fm3/55wc (moderate) and xjj6/qrxm/4w7w/2m5v (high).
  undici@<8.12.2: ">=8.12.2"
  # launch-editor@2.14.1 (vite / Expo dev tooling); GHSA-698v/r825/587h all
  # need >=2.14.2, a same-major patch.
  launch-editor@<=2.14.1: ">=2.14.2"
  # xcode@3.0.1 declares `uuid: ^7.0.3`; GHSA-w5hq-g745-h8pq needs >=11.1.1,
  # four majors ahead. Safe here because xcode only calls uuid.v4() (lib/
  # pbxProject.js), which is unchanged in 11.x, and 11.1.1 still supports
  # CommonJS require(). This is build-time only - xcode is reached through
  # @expo/config-plugins while generating native projects.
  uuid@<11.1.1: ">=11.1.1"
  fast-xml-builder@<1.1.7: ">=1.1.7"
  # GHSA-474x-hrwr-fgx4 needs >=5.12.0. Reached through @aws-sdk/core ->
  # @aws-sdk/xml-builder, which pins a version range we do not control, so the
  # floor has to come from here rather than from a direct dependency bump.
  fast-xml-parser@<5.12.0: ">=5.12.0"
  lodash@>=4.0.0 <=4.17.22: ">=4.17.23"
  hono@<4.12.25: ">=4.12.25"
  # fast-uri arrives transitively (fastify stack), so `pnpm update` cannot
  # move it either. Floor tracks the newest advisory: GHSA-w74x/wjr9/xhq7/
  # 333x all need >=4.2.3, superseding the earlier >=4.1.4 floor. Same major.
  fast-uri@<4.2.3: ">=4.2.3"
  deepmerge-ts@<8.0.0: ">=8.0.0"
  mysql2@<3.22.0: ">=3.22.0"
