openapi: '3.1.0'
info:
  title: Quark API
  version: 2.0.0
  description: |
    Full-stack JavaScript framework API. All endpoints are served under `/api/`.

    **Authentication:** Two independent schemes. Web clients use a NextAuth
    session cookie (`session`). Mobile clients use a Bearer JWT (`bearerAuth`),
    obtained from `POST /api/auth/token`, `/api/auth/apple`, or
    `/api/auth/google`.

    **CSRF:** State-changing endpoints require a token from `GET /api/csrf` in
    the `x-csrf-token` header. That route itself needs a session.

    **Error format:** All errors return:
    ```json
    { "name": "ErrorName", "message": "...", "statusCode": 400, "code": "ERROR_CODE" }
    ```
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: Registration, NextAuth handlers, JWT exchange, and CSRF tokens
  - name: Users
    description: User management
  - name: Devices
    description: Mobile device registration for push notifications
  - name: Files
    description: File uploads & downloads
  - name: Health
    description: Service health checks
  - name: Metrics
    description: Application metrics (Prometheus format)

# ─── Paths ──────────────────────────────────────────────

paths:
  /api/auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: Register a new user
      description: |
        Public endpoint, but returns `403` when self-service signup is disabled
        via `AUTH_ALLOW_SIGNUP=false`. Requires a CSRF token.

        Creates a user with a hashed password and enqueues a welcome email. The
        enqueue is fire-and-forget: if it fails the user is still created.

        Password policy: at least 8 characters with an uppercase letter, a
        lowercase letter, and a digit.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterInput'
      responses:
        '201':
          description: User created, password omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Self-service signup is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/token:
    post:
      operationId: issueTokenPair
      tags: [Auth]
      summary: Exchange email and password for a JWT pair
      description: |
        Public endpoint. Used by the mobile app for Bearer-token auth.

        Accounts created through OAuth have no `password` and cannot sign in
        here; they get a token from `/api/auth/apple` or `/api/auth/google`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      description: |
        Public endpoint. Only the access token is rotated; the refresh token
        stays usable until it expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIs...
        '401':
          description: Invalid or expired refresh token, or a token that is not of type `refresh`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/apple:
    post:
      operationId: signInWithApple
      tags: [Auth]
      summary: Verify an Apple identity token and issue a JWT pair
      description: |
        Public endpoint.

        The `kid` in the token header selects Apple's public key, fetched live
        from `https://appleid.apple.com/auth/keys`, and verified against issuer
        `https://appleid.apple.com` and audience `APPLE_CLIENT_ID`. The `nonce`
        is required: the client sends a raw nonce, Apple returns its SHA-256
        digest in the token's `nonce` claim, and the route re-hashes and
        compares. A user matching the token's email is created on first sign-in.

        `APPLE_CLIENT_ID` accepts a comma-separated list of audiences. Apple
        identity tokens carry *either* the bundle identifier (native iOS) *or*
        the Services ID (web flow) as their `aud` claim, depending on which
        flow the client uses — set both to accept either.

        With `APPLE_CLIENT_ID` unset the endpoint refuses every request with
        `503` rather than verifying a token it cannot bind to this deployment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken, nonce]
              properties:
                identityToken:
                  type: string
                  minLength: 1
                nonce:
                  type: string
                  minLength: 1
                  description: |
                    Required. The raw nonce for this sign-in attempt. Apple is
                    given its SHA-256 digest and returns that digest in the
                    token's `nonce` claim, which the server re-hashes and
                    compares. Omitting it is a `400`.
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Verified token carries no email address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            Invalid Apple token. One response for a bad signature, a wrong
            issuer, a wrong audience, and a nonce mismatch alike — the route
            does not distinguish them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Apple sign-in is not configured on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/google:
    post:
      operationId: signInWithGoogle
      tags: [Auth]
      summary: Verify a Google ID token and issue a JWT pair
      description: |
        Public endpoint.

        The ID token is verified against Google's `tokeninfo` endpoint, and its
        `aud` claim must equal `GOOGLE_CLIENT_ID`. The token's
        `email_verified` claim must also confirm the address, because this
        endpoint creates the account on first sight and an unconfirmed address
        is not proof its owner can read it. A user matching the token's email is
        created on first sign-in.

        With `GOOGLE_CLIENT_ID` unset the endpoint refuses every request with
        `503` rather than verifying a token it cannot bind to this deployment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Verified token carries no email address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            Invalid Google token. One response for a token Google rejected, for an `aud`
            that does not match `GOOGLE_CLIENT_ID`, and for an address Google
            has not verified alike — the route does not distinguish them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Google sign-in is not configured on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/device/register:
    post:
      operationId: registerDevice
      tags: [Devices]
      summary: Register a mobile device for push notifications
      description: |
        Requires a Bearer JWT. The record is upserted on `(userId, deviceId)`,
        so re-registering after a token rotation updates in place.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, pushToken, deviceId]
              properties:
                platform:
                  type: string
                  enum: [ios, android]
                pushToken:
                  type: string
                  minLength: 1
                deviceId:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/csrf:
    get:
      operationId: getCsrfToken
      tags: [Auth]
      summary: Get a CSRF token
      description: |
        Returns a CSRF token and sets an `httpOnly` cookie holding the same
        value. Include the token in the `x-csrf-token` header on every
        state-changing request; the server compares the two.

        No session is required. Registration is pre-authentication, so a
        visitor with no account must be able to obtain a token before they can
        register. The token is a write credential, so every response from this
        endpoint — errors included — is sent `Cache-Control: no-store` and
        `Vary: Cookie`.

        From the browser, `getCsrfToken()` in `@usequark/quark-core/csrf-client`
        fetches and caches it.
      security: []
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
                    example: 'a1b2c3d4e5f6...'
          headers:
            Cache-Control:
              schema:
                type: string
                description: Always `no-store`; the body is a write credential.
            Set-Cookie:
              schema:
                type: string
                example: 'csrf_token=abc123; HttpOnly; SameSite=Strict; Path=/; Max-Age=3600'
        '500':
          description: Token could not be generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Users ───────────────────────────────────────────────

  /api/users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List all users
      security:
        - session: []
      description: |
        Admin-only. Returns a pagination envelope, not a bare array. The
        `password` column is never selected.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Items per page
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

    post:
      operationId: createUser
      tags: [Users]
      summary: Create a user (admin)
      security:
        - session: []
      description: Admin-only. Requires CSRF token.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'

    get:
      operationId: getUser
      tags: [Users]
      summary: Get a user by ID
      security:
        - session: []
      description: Admin-only.
      responses:
        '200':
          description: User object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      operationId: updateUser
      tags: [Users]
      summary: Update a user (admin)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete a user (admin)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Deletion confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      description: |
        Authenticated by Bearer JWT, not by a session cookie. Intended for the
        mobile app. The `password` column is never selected.
      responses:
        '200':
          description: User object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The token's subject no longer resolves to a user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      operationId: updateCurrentUser
      tags: [Users]
      summary: Update the authenticated user's profile
      security:
        - bearerAuth: []
      description: Requires a Bearer JWT and a CSRF token.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The token's subject no longer resolves to a user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ── Files ──────────────────────────────────────────────

  /api/files:
    get:
      operationId: listFiles
      tags: [Files]
      summary: List uploaded files
      security:
        - session: []
      description: Returns the authenticated user's uploaded files (paginated).
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: uploadFile
      tags: [Files]
      summary: Upload file(s)
      security:
        - session: []
      description: |
        Accepts `multipart/form-data`. Validates file type via magic bytes and MIME allow-list.
        Single file returns 201; multiple files return 200 with an array.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: One or more files to upload
      responses:
        '201':
          description: Single file uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '200':
          description: Multiple files uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/File'
        '400':
          description: No files provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: File validation failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  filename:
                    type: string

  /api/files/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'

    get:
      operationId: downloadFile
      tags: [Files]
      summary: Download a file
      description: |
        Public endpoint (access by knowledge of the identifier).
        Returns the raw binary with appropriate Content-Type and Content-Disposition headers.

        `{id}` accepts either the database id or the storage key. `getAssetUrl()`
        in `@usequark/quark-core` builds `/api/files/<storage key>`, so both forms
        resolve.

        `Cache-Control` is a bounded `max-age`, not `immutable`: the URL carries
        no version segment, so the route cannot promise the bytes never change
        under a reused identifier.
      responses:
        '200':
          description: File binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="photo.jpg"'
            Cache-Control:
              schema:
                type: string
                example: 'public, max-age=3600'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteFile
      tags: [Files]
      summary: Delete a file (owner or admin)
      security:
        - session: []
      description: |
        Requires authentication. Only the uploader or an admin can delete. Requires CSRF token.

        The database row is removed first and the storage object second. A failed
        storage delete is reported as a success, because the row is already gone;
        the leftover blob is swept up by the orphaned-file cleanup job. A refused
        row delete (foreign key) returns `409` and leaves the stored bytes intact.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: File deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: File deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: File is still referenced and cannot be deleted

  # ── Health & Metrics ───────────────────────────────────

  /api/health:
    get:
      operationId: healthCheck
      tags: [Health]
      summary: Service health check
      description: |
        Public endpoint. Probes database, Redis, storage, and queues
        concurrently, each under its own deadline capped by an overall 5 second
        budget.

        Always returns `200`. The verdict is in the body's `status` field
        (`ok` / `degraded`), not in the status code: this endpoint is the
        platform healthcheck, and a non-200 makes the orchestrator restart the
        container, which drops every warm connection and produces a fresh
        connection storm on the dependency that was already struggling.

        Exempt from rate limiting, so a probe can never be answered with a 429.

        Error messages are generic in production; outside production they carry
        the underlying driver error. No response contains a credential.
      responses:
        '200':
          description: |
            Check completed. Inspect `status` for the verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/metrics:
    get:
      operationId: getMetrics
      tags: [Metrics]
      summary: Application metrics (Prometheus format)
      description: |
        Returns all registered application metrics in Prometheus exposition format.
        Includes HTTP request counts, durations, in-flight requests, and error counts.
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP http_requests_total Total number of HTTP requests
                  # TYPE http_requests_total counter
                  http_requests_total{method="GET",path="/api/health",status="200"} 42
        '500':
          description: Failed to collect metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# ─── Components ─────────────────────────────────────────

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth session cookie (set automatically after login)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Mobile app access token from `POST /api/auth/token`,
        `POST /api/auth/apple`, or `POST /api/auth/google`. Refresh with
        `POST /api/auth/refresh`.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource CUID

    CsrfToken:
      name: x-csrf-token
      in: header
      required: true
      schema:
        type: string
      description: CSRF token obtained from `GET /api/csrf`

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ── Error ─────────────────────

    Error:
      type: object
      required: [name, message, statusCode, code]
      properties:
        name:
          type: string
          example: NotFoundError
        message:
          type: string
          example: Resource not found
        statusCode:
          type: integer
          example: 404
        code:
          type: string
          example: NOT_FOUND

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true

    # ── Auth ───────────────────────

    TokenPair:
      type: object
      properties:
        token:
          type: string
          description: 'Access token, sent as `Authorization: Bearer <token>`'
          example: 'eyJhbGciOiJIUzI1NiIs...'
        refreshToken:
          type: string
          description: 'Exchange for a new access token at `POST /api/auth/refresh`'
          example: 'eyJhbGciOiJIUzI1NiIs...'
        expiresAt:
          type: string
          format: date-time
          description: Access token expiry

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 3
        hasNext:
          type: boolean
          example: true
        hasPrev:
          type: boolean
          example: false

    # ── User ──────────────────────

    User:
      type: object
      description: |
        The safe select. `password` is never returned by any route.
      properties:
        id:
          type: string
          description: CUID
          example: clx1234567890abcdef
        email:
          type: string
          format: email
          example: user@example.com
        emailVerified:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
          nullable: true
          example: Jane Doe
        image:
          type: string
          format: uri
          nullable: true
        role:
          type: string
          enum: [admin, lead_dev, client_admin, editor, viewer]
          default: viewer
          example: viewer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserCreateInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        image:
          type: string
          format: uri

    UserRegisterInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Must contain uppercase, lowercase, and a digit
        name:
          type: string
          minLength: 2

    UserUpdateInput:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        image:
          type: string
          format: uri

    # ── File ──────────────────────

    File:
      type: object
      properties:
        id:
          type: string
        originalName:
          type: string
          example: photo.jpg
        mimeType:
          type: string
          example: image/jpeg
        size:
          type: integer
          example: 204800
        url:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time

    # ── Health ────────────────────

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        timestamp:
          type: string
          format: date-time
        durationMs:
          type: integer
          description: Wall-clock time the whole check took.
          example: 12
        checks:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, error]
                message:
                  type: string
            redis:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, error]
                message:
                  type: string
                latencyMs:
                  type: number
                  example: 1.23
