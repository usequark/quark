name: Scaffold Container Security

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scaffold-container-security:
    name: Generated Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      QUARK_CLI_BUILD_TEST: "1"
      QUARK_CLI_SCAN_IMAGES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Docker is available
        run: docker --version && docker compose version

      - name: Build and scan generated images
        run: pnpm --filter @techstream/quark-create-app test:build