name: Scaffold Container Security

# Builds the images that the CLI actually scaffolds and scans them. This is
# separate from container-security.yml, which scans this repo's own images.
# The generated output only changes when the templates or base images change,
# so a weekly run is enough rather than daily.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold-container-security:
    name: Generated Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      QUARK_CLI_BUILD_TEST: "1"
      QUARK_CLI_SCAN_IMAGES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Docker is available
        run: docker --version && docker compose version

      - name: Build and scan generated images
        run: pnpm --filter @usequark/quark-create-app test:build
