name: CLI Full Lifecycle E2E

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to run against"
        required: false
        default: "main"

jobs:
  cli-e2e-full:
    name: Full Docker Lifecycle E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Docker is available
        run: docker --version && docker compose version

      # A healthy run is ~40s, but a shared runner with a cold module cache
      # measures ~123s and trips the 120s hard limit even though every phase
      # passed. One noisy sample should not decide the job, so this step is
      # `continue-on-error` and a retry decides the outcome. Thresholds are
      # unchanged - a real regression still fails, it just has to fail twice.
      #
      # `continue-on-error` is required: in GitHub Actions a failed step latches
      # the job to "failure" even when a later step passes, so a plain
      # `if: failure()` retry would still report red. With continue-on-error the
      # step's `outcome` is 'failure' while its `conclusion` stays 'success',
      # which is what lets the retry branch on it and own the result.
      - name: Run full E2E with performance gate
        id: e2e
        continue-on-error: true
        run: |
          pnpm --filter @usequark/quark-create-app test:e2e:full
          pnpm --filter @usequark/quark-create-app check:perf

      - name: Retry E2E once
        if: steps.e2e.outcome == 'failure'
        run: |
          echo "::notice::First attempt failed or breached its threshold; re-running once."
          pnpm --filter @usequark/quark-create-app test:e2e:full
          pnpm --filter @usequark/quark-create-app check:perf

      - name: Upload E2E Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e-test-results-latest.json
          if-no-files-found: ignore

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-debug-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e-test-*/
          if-no-files-found: ignore
