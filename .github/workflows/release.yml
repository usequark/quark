name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Full history, not the default depth of 1. The release guard compares the
      # published version at HEAD~1 against HEAD to decide whether this run was a
      # publish, and at depth 1 that parent object is simply absent - so the
      # comparison silently found nothing and every real release skipped the
      # GitHub Release step. The previous shallow-clone failure in this repo was
      # the same shape, in check-changeset.mjs.
      # persist-credentials must be false. By default checkout writes an
      # http.https://github.com/.extraheader carrying the job's GITHUB_TOKEN
      # into the local git config, and that header wins over anything the
      # release step authenticates with. changesets/action pushes the
      # `changeset-release/main` branch with the git CLI, so the push was sent
      # as `github-actions[bot]` even though the branch was opened with
      # RELEASE_PR_TOKEN: GitHub attributes a run to the credential that pushed
      # it, so every `pull_request` workflow on the release PR came back
      # `action_required` with no check result and the PR could never merge.
      #
      # Disabling it lets the release step's own credential (RELEASE_PR_TOKEN)
      # be the one that pushes, which is the identity the token step verifies.
      # Fetch still works; nothing after this needs the persisted token, and the
      # npm publish uses OIDC rather than either token.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable git hooks
        run: git config core.hooksPath /dev/null

      # The release PR has to be opened by an ordinary actor, not GITHUB_TOKEN.
      # GitHub holds any workflow triggered by a GITHUB_TOKEN-authored PR at
      # `action_required` and it reports NO check result at all, so the required
      # status checks can never be satisfied and the release PR cannot be merged.
      #
      # This step exists because the failure is invisible when the secret is
      # missing. `secrets.RELEASE_PR_TOKEN` for an unset secret expands to an
      # empty string, the change below resolves to nothing, the publish still
      # succeeds, and the whole run reports green while reproducing the exact bug
      # it was meant to fix. Checking the token up front turns that false green
      # into a red run, and the actor check catches a token that is set but is
      # the bot anyway.
      #
      # It also names the actor in the run log. That single line is the fact
      # whose absence turned the previous two attempts into guesswork: whether
      # the PR was authored by a person or by the bot is the whole diagnosis,
      # and it used to be something to infer from a stalled check.
      #
      # Scope: `repo` (private repository) and `workflow`. This credential
      # authors the release PR; the npm publish uses OIDC and no token.
      - name: Verify the release PR token
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [ -z "${RELEASE_PR_TOKEN}" ]; then
            echo "::error::RELEASE_PR_TOKEN is not set, so releases cannot open a mergeable PR."
            echo "Add a personal access token with the 'repo' and 'workflow' scopes as the repository secret RELEASE_PR_TOKEN."
            exit 1
          fi
          actor=$(curl -sS -H "Authorization: Bearer ${RELEASE_PR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user \
            | sed -n 's/.*"login": *"\([^"]*\)".*/\1/p')
          if [ -z "$actor" ] || [ "$actor" = "github-actions[bot]" ]; then
            echo "::error::RELEASE_PR_TOKEN does not authenticate as an ordinary GitHub user (got '${actor:-no login}')."
            echo "A GITHUB_TOKEN-authored PR has its workflows held at action_required, so it can never satisfy required checks."
            exit 1
          fi
          echo "Release PRs will be opened by ${actor}."

      # Two identities have to line up, and both were wrong before this step:
      #
      # 1. The PUSHER. GitHub decides whether a `pull_request` run may start
      #    from the credential that pushed the head commit, not from the PR's
      #    author. changesets/action opens the PR with its `github-token` input
      #    (RELEASE_PR_TOKEN) but pushes the branch with the git CLI, and the
      #    checkout's persisted extraheader was sending that push as
      #    `github-actions[bot]`. `persist-credentials: false` above fixes this.
      #
      # 2. The COMMIT AUTHOR. The action runs with `setupGitUser` enabled, whose
      #    `setupUser()` writes `user.name`/`user.email` = `github-actions[bot]`
      #    into the repo config. Local config outranks the environment for
      #    these, so exporting GIT_AUTHOR_* alone does not help - the commit came
      #    out bot-authored even with all four set. So the repo config is
      #    written here as well, which is what actually takes effect.
      #
      # Ordering caveat: this step runs BEFORE the action, so the action's
      # setup could in principle overwrite it. On the pinned revision `setupUser()`
      # is a no-op on this path (its octokit-present early return), which is why
      # the config survives. The probe below is what turns a future regression
      # of that into a red run rather than another bot-authored commit.
      #
      # Why the existing guard missed both: it inspects the secret, not the
      # resulting commit or the credential that pushed. It logged "Release PRs
      # will be opened by Bobnoddle" in the very run that pushed a bot-authored
      # commit - a green run reproducing the exact bug the step exists to
      # prevent.
      - name: Set the release commit author
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          actor=$(curl -sS -H "Authorization: Bearer ${RELEASE_PR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user \
            | sed -n 's/.*"login": *"\([^"]*\)".*/\1/p')
          # Written to GITHUB_ENV so the release step inherits them, and to the
          # repo config so they outrank the action's own `setupUser()`.
          for pair in \
            "GIT_AUTHOR_NAME=${actor}" \
            "GIT_AUTHOR_EMAIL=${actor}@users.noreply.github.com" \
            "GIT_COMMITTER_NAME=${actor}" \
            "GIT_COMMITTER_EMAIL=${actor}@users.noreply.github.com"
          do
            echo "${pair}" >> "$GITHUB_ENV"
            export "${pair?}"
          done
          git config user.name "${actor}"
          git config user.email "${actor}@users.noreply.github.com"
          for ident in GIT_AUTHOR_IDENT GIT_COMMITTER_IDENT; do
            if ! git -c user.useConfigOnly=true var "${ident}" >/dev/null 2>&1; then
              echo "::error::${ident} is unresolvable, so the release commit would be authored as github-actions[bot] and its pull_request runs would stall at action_required."
              exit 1
            fi
          done
          echo "Release commits will be authored by ${actor}."

      # IMPORTANT: merge release PRs with a MERGE COMMIT, not squash.
      # Changesets detects a release by the `changeset-release/main` branch name
      # in the commit message. A squash merge rewrites it to
      # "chore: version packages (#123)", so this action skips publishing and
      # only regenerates the release PR - the release then silently never
      # reaches npm. Use "Create a merge commit" (gh pr merge --merge).
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # THE authoritative token. changesets/action reads its GitHub
          # credential from this input, defaulting to `${{ github.token }}`, and
          # uses it for every API call: the branch push, the commit, and the PR
          # itself. This is the value that determines who the release PR is
          # authored by.
          #
          # Setting `GITHUB_TOKEN` in `env:` below does NOT do this. The action
          # ignores the ambient env var and reads only this input, so the token
          # kept landing on the default and #185 came back authored by
          # `github-actions[bot]` with an empty check rollup - the original
          # stall, reproduced after the fix that was supposed to end it. The
          # `GITHUB_TOKEN` entry in `env:` is kept only so the changesets CLI
          # invoked by `publish` sees the same credential.
          github-token: ${{ secrets.RELEASE_PR_TOKEN }}
          version: node scripts/release-version.mjs
          publish: pnpm changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: false
        env:
          # For the `changeset publish` child process only. The PR author is
          # decided by the `github-token` input above, not by this.
          #
          # Scope: `repo` (private repository) and `workflow`.
          #
          # There is deliberately NO npm token here. `npm publish` authenticates
          # with OIDC: this job holds `id-token: write`, and npm has a trusted
          # publisher for `usequark/quark` + `release.yml` with `npm publish`
          # allowed. npm detects the OIDC environment and exchanges it for a
          # short-lived publish token, falling back to a long-lived one only if
          # no trusted publisher matches.
          #
          # Setting NODE_AUTH_TOKEN here would be actively harmful even if the
          # secret still existed: setup-node writes an `always-auth` line keyed
          # on it, and an empty value makes npm send a literal empty auth header
          # rather than attempting the OIDC exchange.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}

      # Catches the squash-merge case above, which otherwise fails silently, and
      # reports whether this run actually published anything.
      #
      # This does NOT use changesets/action's `published` output. That output is
      # set only when the publish printed `New tag:`, which `changeset publish`
      # emits solely from tagPublish() - guarded by the configured *tagger*. This
      # repo has no tagger, so the output was permanently "false" and the release
      # step below was skipped on every release from 1.23.3 to 1.23.6. npm is
      # no substitute: the registry took ~9 minutes to serve a new version here,
      # far longer than this step will wait. The signal is taken from the repo
      # instead - a published package's version advancing between HEAD~1 and HEAD.
      - name: Verify the release was published
        id: release-guard
        run: node scripts/check-release-published.mjs

      - name: Create consolidated GitHub Release
        if: steps.release-guard.outputs.released == 'true'
        uses: actions/github-script@v8
        env:
          # Via env, not `${{ }}` interpolation: the value is JSON built from
          # package metadata and must not be spliced into the script body.
          RELEASE_PUBLISHED: ${{ steps.release-guard.outputs.published }}
        with:
          script: |
            const published = JSON.parse(process.env.RELEASE_PUBLISHED);
            const today = new Date().toISOString().split('T')[0].replace(/-/g, '.');
            
            // Check for existing tags with same date to add a suffix
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10,
            });
            const existingToday = tags.filter(t => t.name.startsWith(`v${today}`));
            const tag = existingToday.length === 0 ? `v${today}` : `v${today}.${existingToday.length}`;

            // Build release body
            const lines = ['## Published Packages\n'];
            for (const pkg of published) {
              lines.push(`- \`${pkg.name}\` - **${pkg.version}**`);
            }
            lines.push('\n---\n');
            lines.push(`Full changelog: https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${tag}...main`);

            // A re-run of the same commit would otherwise fail on an existing
            // tag, turning a published release into a red workflow.
            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Quark ${tag}`,
                body: lines.join('\n'),
                target_commitish: context.sha,
              });
              core.info(`Created release ${tag}`);
            } catch (error) {
              if (error.status !== 422) throw error;
              // GitHub's 422 does not carry the release id, so look it up.
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.data.id,
                name: `Quark ${tag}`,
                body: lines.join('\n'),
              });
              core.info(`Release ${tag} already existed - updated in place.`);
            }
