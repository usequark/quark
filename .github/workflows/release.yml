name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - name: Create consolidated GitHub Release
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const published = JSON.parse('${{ steps.changesets.outputs.publishedPackages }}');
            const today = new Date().toISOString().split('T')[0].replace(/-/g, '.');
            
            // Check for existing tags with same date to add a suffix
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10,
            });
            const existingToday = tags.filter(t => t.name.startsWith(`v${today}`));
            const tag = existingToday.length === 0 ? `v${today}` : `v${today}.${existingToday.length}`;

            // Build release body
            const lines = ['## Published Packages\n'];
            for (const pkg of published) {
              lines.push(`- \`${pkg.name}\` — **${pkg.version}**`);
            }
            lines.push('\n---\n');
            lines.push(`Full changelog: https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${tag}...main`);

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Quark ${tag}`,
              body: lines.join('\n'),
              target_commitish: context.sha,
            });
