name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Full history, not the default depth of 1. The release guard compares the
      # published version at HEAD~1 against HEAD to decide whether this run was a
      # publish, and at depth 1 that parent object is simply absent - so the
      # comparison silently found nothing and every real release skipped the
      # GitHub Release step. The previous shallow-clone failure in this repo was
      # the same shape, in check-changeset.mjs.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable git hooks
        run: git config core.hooksPath /dev/null

      # The release PR has to be opened by an ordinary actor, not GITHUB_TOKEN.
      # GitHub holds any workflow triggered by a GITHUB_TOKEN-authored PR at
      # `action_required` and it reports NO check result at all, so the required
      # status checks can never be satisfied and the release PR cannot be merged.
      #
      # This step exists because the failure is invisible when the secret is
      # missing. `secrets.RELEASE_PR_TOKEN` for an unset secret expands to an
      # empty string, changesets falls back to GITHUB_TOKEN, the publish still
      # succeeds, and the whole run reports green while reproducing the exact bug
      # it was meant to fix. Checking the token up front turns that false green
      # into a red run, and the actor check below catches a token that is set but
      # is the bot anyway.
      #
      # Scope: `repo` (private repository) and `workflow`. Deliberately not
      # NPM_PUBLISH_TOKEN, so the publish credential stays isolated.
      - name: Verify the release PR token
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [ -z "${RELEASE_PR_TOKEN}" ]; then
            echo "::error::RELEASE_PR_TOKEN is not set, so releases cannot open a mergeable PR."
            echo "Add a personal access token with the 'repo' and 'workflow' scopes as the repository secret RELEASE_PR_TOKEN."
            exit 1
          fi
          actor=$(curl -sS -H "Authorization: Bearer ${RELEASE_PR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user \
            | sed -n 's/.*"login": *"\([^"]*\)".*/\1/p')
          if [ -z "$actor" ] || [ "$actor" = "github-actions[bot]" ]; then
            echo "::error::RELEASE_PR_TOKEN does not authenticate as an ordinary GitHub user (got '${actor:-no login}')."
            echo "A GITHUB_TOKEN-authored PR has its workflows held at action_required, so it can never satisfy required checks."
            exit 1
          fi
          echo "Release PRs will be opened by ${actor}."

      # IMPORTANT: merge release PRs with a MERGE COMMIT, not squash.
      # Changesets detects a release by the `changeset-release/main` branch name
      # in the commit message. A squash merge rewrites it to
      # "chore: version packages (#123)", so this action skips publishing and
      # only regenerates the release PR - the release then silently never
      # reaches npm. Use "Create a merge commit" (gh pr merge --merge).
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: node scripts/release-version.mjs
          publish: pnpm changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: false
        env:
          # A dedicated token, NOT secrets.GITHUB_TOKEN.
          #
          # Changesets opens the release PR with this token. If it is
          # GITHUB_TOKEN, GitHub applies its anti-recursion guard: every
          # workflow triggered by that PR is held at `action_required` until a
          # human approves it, and the run reports no check result at all. The
          # required status checks then can never be satisfied, so the release
          # PR cannot be merged and the release never happens.
          #
          # A personal access token is a normal actor, so its PRs' checks run
          # normally and the whole thing needs no human click.
          #
          # Scope: `repo` (private repository) and `workflow`. Do not reuse
          # NPM_PUBLISH_TOKEN - keep the publish credential separate.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      # Catches the squash-merge case above, which otherwise fails silently, and
      # reports whether this run actually published anything.
      #
      # This does NOT use changesets/action's `published` output. That output is
      # set only when the publish printed `New tag:`, which `changeset publish`
      # emits solely from tagPublish() - guarded by the configured *tagger*. This
      # repo has no tagger, so the output was permanently "false" and the release
      # step below was skipped on every release from 1.23.3 to 1.23.6. npm is
      # no substitute: the registry took ~9 minutes to serve a new version here,
      # far longer than this step will wait. The signal is taken from the repo
      # instead - a published package's version advancing between HEAD~1 and HEAD.
      - name: Verify the release was published
        id: release-guard
        run: node scripts/check-release-published.mjs

      - name: Create consolidated GitHub Release
        if: steps.release-guard.outputs.released == 'true'
        uses: actions/github-script@v8
        env:
          # Via env, not `${{ }}` interpolation: the value is JSON built from
          # package metadata and must not be spliced into the script body.
          RELEASE_PUBLISHED: ${{ steps.release-guard.outputs.published }}
        with:
          script: |
            const published = JSON.parse(process.env.RELEASE_PUBLISHED);
            const today = new Date().toISOString().split('T')[0].replace(/-/g, '.');
            
            // Check for existing tags with same date to add a suffix
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10,
            });
            const existingToday = tags.filter(t => t.name.startsWith(`v${today}`));
            const tag = existingToday.length === 0 ? `v${today}` : `v${today}.${existingToday.length}`;

            // Build release body
            const lines = ['## Published Packages\n'];
            for (const pkg of published) {
              lines.push(`- \`${pkg.name}\` - **${pkg.version}**`);
            }
            lines.push('\n---\n');
            lines.push(`Full changelog: https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${tag}...main`);

            // A re-run of the same commit would otherwise fail on an existing
            // tag, turning a published release into a red workflow.
            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Quark ${tag}`,
                body: lines.join('\n'),
                target_commitish: context.sha,
              });
              core.info(`Created release ${tag}`);
            } catch (error) {
              if (error.status !== 422) throw error;
              // GitHub's 422 does not carry the release id, so look it up.
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.data.id,
                name: `Quark ${tag}`,
                body: lines.join('\n'),
              });
              core.info(`Release ${tag} already existed - updated in place.`);
            }
