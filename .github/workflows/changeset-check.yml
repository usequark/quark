name: Changeset Check

on:
  pull_request:
    branches: [main]

jobs:
  changeset-check:
    name: Changeset Status
    runs-on: ubuntu-latest
    # Skip the changesets release PR: it has consumed its changesets and bumped
    # versions, so `changeset status` would always report "no changesets found".
    if: github.actor != 'dependabot[bot]' && github.head_ref != 'changeset-release/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1

      - name: Check for changesets
        run: pnpm changeset status --since="origin/${{ github.base_ref }}"
