name: CLI Tests

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/cli/**"

jobs:
  cli-test:
    name: CLI Unit & Scaffolding E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run unit tests
        run: pnpm --filter @techstream/quark-create-app test

      - name: Run scaffolding E2E
        run: pnpm --filter @techstream/quark-create-app test:e2e
