name: Auto-merge Dependabot

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: meta

      # `gh pr merge --auto` is only permitted when the base branch has
      # protection with required status checks. A private repository on a Free
      # plan can have neither, so every patch Dependabot PR would go red for a
      # reason that has nothing to do with the dependency being upgraded.
      #
      # An earlier version tried to detect this in advance, via
      # GET /repos/{repo}/branches/{branch}/protection plus /rulesets. That
      # cannot be done from a workflow: both endpoints require the
      # `administration` permission, which is a GitHub App permission and is NOT
      # available on GITHUB_TOKEN. Declaring it here does not fail loudly - it
      # makes the whole workflow invalid, so every run ends `failure` with zero
      # jobs and no log to explain why.
      #
      # So the merge is attempted and the failure classified instead. Anything
      # unrecognised still fails the run, so a genuine problem is not swallowed.
      - name: Auto-merge patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if output=$(gh pr merge "$PR_URL" --auto --squash 2>&1); then
            echo "$output"
            exit 0
          fi

          if printf '%s' "$output" | grep -qiE "auto.?merge is not allowed|not protected|branch protection"; then
            echo "::notice::Skipping auto-merge: the base branch has no protection, so --auto is unavailable."
            echo "::notice::Expected while the repository is private on a Free plan. Auto-merge resumes on its own once it is public or the org is on a paid plan."
            exit 0
          fi

          echo "$output"
          exit 1