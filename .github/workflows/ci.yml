name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint & Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run standards
        run: pnpm standards

      # Fails on any advisory the repo has not explicitly accepted. The three in
      # docs/dependency-audit.md are allowlisted in scripts/check-audit.mjs, so
      # this passes today and turns red when a fourth appears - including when
      # the audit itself cannot run, which must not read as a clean tree.
      - name: Audit dependencies
        run: pnpm audit:check

      # Template drift shares this job's install rather than paying for a
      # second full monorepo install on every run.
      - name: Sync templates
        if: github.actor != 'dependabot[bot]' || github.event_name == 'push'
        run: pnpm --filter @usequark/quark-create-app sync-templates

      - name: Check for drift
        if: github.actor != 'dependabot[bot]' || github.event_name == 'push'
        run: |
          if ! git diff --quiet packages/cli/templates/; then
            echo ""
            echo "❌ Template drift detected!"
            echo "Run 'pnpm --filter @usequark/quark-create-app sync-templates' locally and commit the changes."
            git diff --stat packages/cli/templates/
            exit 1
          else
            echo "✅ Templates are in sync."
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quark_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: quark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: quark_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: quark_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NEXTAUTH_SECRET: ci-test-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run tests
        run: pnpm test

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @usequark/quark-mobile lint

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/mobile

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [checks, test, mobile]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build
        run: pnpm build
