name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run standards
        run: pnpm standards

  template-drift:
    name: Template Drift Check
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync templates
        run: pnpm --filter @techstream/quark-create-app sync-templates

      - name: Check for drift
        run: |
          if ! git diff --quiet packages/cli/templates/; then
            echo ""
            echo "❌ Template drift detected!"
            echo "Run 'pnpm --filter @techstream/quark-create-app sync-templates' locally and commit the changes."
            git diff --stat packages/cli/templates/
            exit 1
          else
            echo "✅ Templates are in sync."
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quark_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: quark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: quark_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: quark_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NEXTAUTH_SECRET: ci-test-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  scaffold-windows:
    name: Scaffold smoke test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scaffold test project
        run: node packages/cli/src/index.js test-project --no-prompts --skip-install --skip-docker
        shell: bash

      - name: Verify required packages exist
        run: |
          test -f test-project/packages/config/package.json || (echo "FAIL: packages/config/package.json missing" && exit 1)
          test -f test-project/packages/db/package.json    || (echo "FAIL: packages/db/package.json missing"     && exit 1)
          test -f test-project/package.json                || (echo "FAIL: root package.json missing"             && exit 1)
          echo "All required scaffold files present"
        shell: bash

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, template-drift, scaffold-windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build
        run: pnpm build
