name: Auto-approve release runs

# Changesets opens the release PR with GITHUB_TOKEN, and GitHub holds any run
# triggered by GITHUB_TOKEN until a human approves it. Every release PR
# therefore sat at `action_required` and reported no check runs at all, so
# branch protection's required checks could never be satisfied and the release
# PR could not be merged. That is the silent-stall class this repo has spent
# the last week closing.
#
# `pull_request_target` is NOT the answer. It sounds right - it runs in the base
# repository's context with a write-scoped token - but it is subject to the same
# anti-recursion guard, so it never fires for a GITHUB_TOKEN-created PR either.
# Verified: with it in place, the approve workflow produced zero runs while the
# release PR's four workflows sat at `action_required`.
#
# `workflow_run` is what does fire. It triggers when another workflow finishes,
# regardless of who triggered it, and it runs in the base repository's context
# with a write-scoped `GITHUB_TOKEN`. So: run it on completion of any workflow
# that could be the release PR's, look up the runs waiting on that commit, and
# approve them.
#
# This only ever approves. It does not merge. Approval is what lets the real
# checks execute; their results still gate the merge.

on:
  workflow_run:
    workflows: ["CI", "Changeset Check", "Scaffold Smoke Test (Windows)", "Auto-merge Dependabot"]
    types: [requested, in_progress]

permissions:
  actions: write
  pull-requests: read

jobs:
  approve:
    name: Approve pending release runs
    runs-on: ubuntu-latest
    steps:
      - name: Approve runs awaiting a human on this commit
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;

            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: sha,
              event: 'pull_request',
            });

            // A run awaiting approval reports status `completed` with conclusion
            // `action_required` - not `queued`. Filtering on status would approve
            // nothing and the stall would look unfixed.
            //
            // Never approve a run that actually executed: a real failure is the
            // gate working, and approving it would defeat the gate.
            const pending = runs.workflow_runs.filter(
              (run) => run.conclusion === 'action_required',
            );

            for (const run of pending) {
              await github.rest.actions.approveWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              core.info(`Approved ${run.name} (${run.id})`);
            }

            core.info(
              pending.length === 0
                ? `No runs awaiting approval on ${sha.slice(0, 7)}.`
                : `Approved ${pending.length} run(s) on ${sha.slice(0, 7)}.`,
            );
