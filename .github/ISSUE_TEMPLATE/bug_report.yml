name: Bug report
description: Something in Quark does not work as documented
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a **security vulnerability**, do not file it here. Use
        [private vulnerability reporting](https://github.com/usequark/quark/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe, and what did you expect instead?
      placeholder: |
        Running `npx @techstream/quark-create-app my-app` produced a project that
        fails to start with ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: package
    attributes:
      label: Affected package
      description: Which package is involved?
      placeholder: "@techstream/quark-core@2.4.3"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: "v22.14.0"

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.5 / Ubuntu 24.04 / Windows 11"

  - type: textarea
    id: config
    attributes:
      label: Quark configuration
      description: >
        Relevant options, not secrets. Which packages/features did you scaffold?
        For example `--packages ui,jobs` or `--add admin`.
      value: |
        create command:
        features:

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Full error text or stack trace, with any secrets removed.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions for this
          required: true
        - label: I removed secrets and tokens from the output above
          required: false
