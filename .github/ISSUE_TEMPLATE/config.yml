    about: Ask a question or start a discussion about a feature or a pull request.
  - name: Contributing guide
    url: https://github.com/usequark/quark/blob/main/CONTRIBUTING.md
    about: Conventions, change workflow, and how to run the checks.
  - name: Code of Conduct
    url: https://github.com/usequark/quark/blob/main/CODE_OF_CONDUCT.md
    about: Expected behaviour in all project spaces, and how to report a violation.
