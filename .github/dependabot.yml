version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday

    # Split by semver update type instead of lumping every production bump into
    # one PR. A single "production" group produced a 35-package PR mixing
    # patch, minor and major bumps together, so 9 majors were queued behind a
    # wall of safe patches and the one real breakage (bullmq 6 removing
    # `queue.client`) was buried in CI noise. Majors get their own PR so a
    # breaking change is reviewed on its own.
    groups:
      production-majors:
        dependency-type: production
        update-types: ["major"]
      development-majors:
        dependency-type: development
        update-types: ["major"]
      production-minor:
        dependency-type: production
        update-types: ["minor"]
      production-patch:
        dependency-type: production
        update-types: ["patch"]
      development-minor:
        dependency-type: development
        update-types: ["minor"]
      development-patch:
        dependency-type: development
        update-types: ["patch"]

    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 6

  # Action pins drift for a different reason than npm pins: nothing here fails
  # when an action ages out, so `pnpm/action-setup@v4` sat on a Node 20 runtime
  # while the rest of the workflow had already moved to Node 24. GitHub only
  # surfaces that as an annotation in the run log, not as a red check, so
  # nothing in CI ever pushed us to bump it.
  #
  # This block is the actual fix for that class of drift. Majors get their own
  # PR for the same reason the npm block splits them: action majors are the ones
  # that can change runtime (Node 20 -> 24) or drop inputs, and that review
  # should not arrive buried in a patch bundle.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-majors:
        update-types: ["major"]
      actions-minor:
        update-types: ["minor"]
      actions-patch:
        update-types: ["patch"]
    commit-message:
      prefix: "deps(actions)"
    open-pull-requests-limit: 4
