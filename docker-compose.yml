services:
  # --- 1. PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_IN_ENV_FILE}
      POSTGRES_DB: ${POSTGRES_DB:-quark_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quark_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 2. Redis Cache & Job Queue ---
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 3. Mailpit (Local SMTP Server) ---
  mailpit:
    image: ghcr.io/axllent/mailpit
    container_name: mailpit
    restart: always
    ports:
      # SMTP port (used by application to send mail)
      - "${MAIL_SMTP_PORT:-1025}:1025"
      # Web UI port (to view sent emails)
      - "${MAIL_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data: