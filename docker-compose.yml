version: '3.8'

services:
  # --- 1. PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: ts_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ts_postgres_data:/var/lib/postgresql/data

  # --- 2. Redis Cache & Job Queue ---
  redis:
    image: redis:7-alpine
    container_name: ts_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ts_redis_data:/data

  # --- 3. Mailhog (Local SMTP Server) ---
  mailhog:
    image: mailhog/mailhog
    container_name: ts_mailhog
    restart: always
    ports:
      # SMTP port (used by application to send mail)
      - "1025:1025"
      # Web UI port (to view sent emails)
      - "8025:8025"

volumes:
  ts_postgres_data:
  ts_redis_data: